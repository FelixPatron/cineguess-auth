<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CineGuess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#120d10; --card:#1a1216; --card2:#241a1f; --line:#3a2b32; --cream:#f3ece4; --mute:#a99ca1; --gold:#F5C518; --reel:#E50914; --ok:#3ecf8e; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--cream); }
  body { font-family:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
    background: radial-gradient(900px 500px at 50% -10%, rgba(245,197,24,.12), transparent 60%), var(--bg); }
  .wrap { width:100%; max-width:420px; }
  .brand { text-align:center; font-family:'Oswald', 'Arial Narrow', sans-serif; font-weight:700; font-size:34px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:22px; }
  .brand b { color:var(--gold); font-weight:700; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:34px 26px 28px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.45); animation:in .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes in { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  .icon { width:84px; height:84px; border-radius:50%; margin:0 auto 18px; display:grid; place-items:center; border:2px solid rgba(245,197,24,.6); background:rgba(245,197,24,.1); color:var(--gold); }
  .icon.ok { border-color:rgba(62,207,142,.65); background:rgba(62,207,142,.12); color:var(--ok); }
  .icon.bad { border-color:rgba(229,9,20,.65); background:rgba(229,9,20,.12); color:var(--reel); }
  .icon svg { width:38px; height:38px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  h1 { font-family:'Oswald', 'Arial Narrow', sans-serif; font-weight:600; font-size:30px; margin:0 0 8px; letter-spacing:.02em; }
  p { color:var(--mute); line-height:1.55; margin:0 0 6px; font-size:15px; }
  p.em { color:var(--cream); font-weight:600; word-break:break-all; }
  .spin { width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--gold); animation:sp .8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  form { margin-top:20px; text-align:left; }
  label { display:block; font-size:13px; color:var(--mute); margin:0 0 6px 2px; }
  input { width:100%; font:inherit; font-size:16px; color:var(--cream); background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:14px 14px; margin-bottom:12px; }
  input:focus { outline:2px solid var(--gold); outline-offset:1px; }
  button { width:100%; font:inherit; font-weight:700; font-size:16px; border:0; border-radius:14px; padding:15px; cursor:pointer; background:var(--gold); color:#1a1216; margin-top:6px; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#ff8087; font-size:14px; margin:4px 0 8px; min-height:0; }
  .hint { margin-top:20px; padding:12px 14px; border-radius:14px; background:var(--card2); border:1px solid var(--line); font-size:14px; color:var(--cream); }
  .foot { text-align:center; color:var(--mute); font-size:12px; margin-top:18px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Cine<b>Guess</b></div>
  <div class="card" id="card"><div class="spin" style="margin:30px auto"></div></div>
  <div class="foot">CineGuess &middot; Film tahmin oyunu</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
// Bu degerler herkese acik web yapilandirmasidir, gizli degildir.
firebase.initializeApp({
  apiKey: "AIzaSyAvbelSZYEzl4PQxIV0tXgcqcuA6on5Za8",
  authDomain: "cineguessmovie.firebaseapp.com",
  projectId: "cineguessmovie"
});
const auth = firebase.auth();
auth.languageCode = "tr";

const ICONS = {
  mail: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg>',
  ok:   '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bad:  '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  key:  '<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg>'
};
const $card = document.getElementById("card");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function show(kind, icon, title, body, extra) {
  $card.innerHTML =
    '<div class="icon ' + kind + '">' + ICONS[icon] + '</div>' +
    '<h1>' + esc(title) + '</h1>' + body + (extra || "");
}
function msgFor(e) {
  const m = {
    "auth/expired-action-code": "Bu bağlantının süresi dolmuş.",
    "auth/invalid-action-code": "Bu bağlantı geçersiz ya da daha önce kullanılmış.",
    "auth/user-disabled": "Bu hesap devre dışı bırakılmış.",
    "auth/user-not-found": "Bu bağlantıya ait hesap bulunamadı.",
    "auth/weak-password": "Şifre çok zayıf. En az 6 karakter kullan.",
    "auth/network-request-failed": "İnternet bağlantını kontrol edip tekrar dene."
  };
  return m[e && e.code] || "Bir sorun oluştu. Lütfen uygulamadan yeni bir bağlantı iste.";
}
const BACK = '<div class="hint">Şimdi <b>CineGuess uygulamasına dön</b>. Uygulama doğrulamayı kendisi fark eder; takılırsa "Doğruladım, devam et" düğmesine bas.</div>';
const RETRY = '<div class="hint">Uygulamaya dönüp yeni bir bağlantı iste, sonra e-postandaki en son bağlantıyı kullan.</div>';

const q = new URLSearchParams(location.search);
const mode = q.get("mode"), code = q.get("oobCode");

async function run() {
  if (!mode || !code) {
    return show("", "mail", "CineGuess", '<p>Bu sayfa e-posta bağlantıları içindir. Uygulamaya dönebilirsin.</p>');
  }
  if (mode === "verifyEmail") {
    try {
      await auth.applyActionCode(code);
      show("ok", "ok", "E-postan doğrulandı", '<p>Hesabın artık hazır. Film tahmin etmeye başlayabilirsin.</p>', BACK);
    } catch (e) {
      show("bad", "bad", "Doğrulanamadı", '<p>' + esc(msgFor(e)) + '</p>', RETRY);
    }
  } else if (mode === "resetPassword") {
    let email;
    try { email = await auth.verifyPasswordResetCode(code); }
    catch (e) { return show("bad", "bad", "Bağlantı geçersiz", '<p>' + esc(msgFor(e)) + '</p>', RETRY); }
    show("", "key", "Yeni şifre belirle", '<p>Şu hesap için yeni şifre seç:</p><p class="em">' + esc(email) + '</p>',
      '<form id="f"><label for="p1">Yeni şifre</label><input id="p1" type="password" minlength="6" autocomplete="new-password" required>' +
      '<label for="p2">Yeni şifre (tekrar)</label><input id="p2" type="password" minlength="6" autocomplete="new-password" required>' +
      '<div class="err" id="err"></div><button id="b" type="submit">Şifreyi kaydet</button></form>');
    document.getElementById("f").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value;
      const err = document.getElementById("err"), b = document.getElementById("b");
      err.textContent = "";
      if (p1.length < 6) { err.textContent = "Şifre en az 6 karakter olmalı."; return; }
      if (p1 !== p2) { err.textContent = "Şifreler aynı değil."; return; }
      b.disabled = true; b.textContent = "Kaydediliyor";
      try {
        await auth.confirmPasswordReset(code, p1);
        show("ok", "ok", "Şifren güncellendi", '<p>Yeni şifrenle giriş yapabilirsin.</p>', '<div class="hint">CineGuess uygulamasına dön ve yeni şifrenle giriş yap.</div>');
      } catch (e) { err.textContent = msgFor(e); b.disabled = false; b.textContent = "Şifreyi kaydet"; }
    });
  } else if (mode === "recoverEmail") {
    try {
      const info = await auth.checkActionCode(code);
      await auth.applyActionCode(code);
      show("ok", "ok", "E-posta adresin geri alındı", '<p>Hesabının e-postası şuna döndürüldü:</p><p class="em">' + esc(info.data.email || "") + '</p>',
        '<div class="hint">Bu değişikliği sen yapmadıysan şifreni de sıfırlamanı öneririz.</div>');
    } catch (e) { show("bad", "bad", "İşlem yapılamadı", '<p>' + esc(msgFor(e)) + '</p>'); }
  } else {
    show("bad", "bad", "Bilinmeyen işlem", '<p>Bu bağlantı desteklenmiyor. Uygulamadan yeni bir bağlantı iste.</p>');
  }
}
run();
</script>
</body>
</html>
